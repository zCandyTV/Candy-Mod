const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(n,p){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(n.trim().toLowerCase()+"::"+p),"PBKDF2",false,["deriveKey"]);
  for(const u of D.u){
    try{
      const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(u.s),iterations:D.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
      const raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(u.i)},k,b64(u.d));
      return await openApp(new Uint8Array(raw));
    }catch(e){}
  }
  return false;
}
async function openApp(raw){
  const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.iv)},k,b64(D.c));
  try{sessionStorage.setItem("sp_k",btoa(String.fromCharCode(...raw)));}catch(e){}
  const html=new TextDecoder().decode(pt);
  if(typeof document.open==="function"){document.open();document.write(html);document.close();}
  return html;
}
if(typeof document!=="undefined"&&document.getElementById("f")){
  document.getElementById("f").onsubmit=async ev=>{
    ev.preventDefault();const e=document.getElementById("e");e.textContent="Prüfe …";
    const ok=await unlock(document.getElementById("n").value,document.getElementById("p").value);
    if(!ok)e.textContent="Name oder Passwort falsch.";
  };
  try{const s=sessionStorage.getItem("sp_k");if(s)openApp(b64(s)).catch(()=>sessionStorage.removeItem("sp_k"));}catch(e){}
}
